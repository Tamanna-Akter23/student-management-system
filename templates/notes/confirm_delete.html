{% extends 'base.html' %}
{% block title %}Delete Note | StudentMS{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6"><div class="card border-0 shadow-sm"><div class="card-body p-4 p-md-5 text-center">
  <div class="display-5 mb-3">⚠️</div><h1 class="h3 fw-bold">Delete this note?</h1><p class="text-secondary">Student ID: <strong>{{ item.student_id }}</strong></p><p class="border rounded p-3 bg-light">{{ item.note }}</p>
  <form method="post">{% csrf_token %}<button class="btn btn-danger" type="submit">Yes, delete</button> <a class="btn btn-outline-secondary" href="{% url 'note_list' %}">Cancel</a></form>
</div></div></div></div>
{% endblock %}
