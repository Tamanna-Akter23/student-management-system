{% extends 'base.html' %}
{% block title %}{{ title }} | StudentMS{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7"><div class="card border-0 shadow-sm"><div class="card-body p-4 p-md-5">
  <h1 class="h3 fw-bold mb-4">{{ title }}</h1>
  <form method="post">{% csrf_token %}
    <div class="mb-3"><label class="form-label fw-semibold">Student ID</label><input class="form-control" name="student_id" value="{{ item.student_id|default:'' }}" placeholder="e.g. 1119068" required></div>
    <div class="mb-3"><label class="form-label fw-semibold">Note</label><textarea class="form-control" name="note" rows="5" placeholder="Write the student note here" required>{{ item.note|default:'' }}</textarea></div>
    <button class="btn btn-primary" type="submit">Save</button> <a class="btn btn-outline-secondary" href="{% url 'note_list' %}">Cancel</a>
  </form>
</div></div></div></div>
{% endblock %}
