{% extends 'base.html' %}
{% block title %}{{ title }} | StudentMS{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7">
  <div class="card border-0 shadow-sm">
    <div class="card-body p-4 p-md-5">
      <h1 class="h3 fw-bold mb-4">{{ title }}</h1>
      <form method="post" novalidate>{% csrf_token %}
        {% for field in form %}
        <div class="mb-3"><label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="text-danger small mt-1">{{ field.errors|striptags }}</div>{% endif %}</div>
        {% endfor %}
        <div class="d-flex gap-2 pt-2"><button class="btn btn-primary" type="submit">Save</button><a class="btn btn-outline-secondary" href="{% url back_url %}">Cancel</a></div>
      </form>
    </div>
  </div>
</div></div>
{% endblock %}
