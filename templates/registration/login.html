{% extends 'base.html' %}
{% block title %}Login | StudentMS{% endblock %}
{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-7 col-lg-5">
    <div class="card border-0 shadow-lg">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="display-5 mb-2">🎓</div>
          <h1 class="h3 fw-bold">Welcome back</h1>
          <p class="text-secondary mb-0">Sign in to manage students, courses, and notes.</p>
        </div>
        {% if form.errors %}<div class="alert alert-danger">Invalid username or password.</div>{% endif %}
        <form method="post">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}">
          <div class="mb-3">
            <label class="form-label" for="id_username">Username</label>
            <input class="form-control form-control-lg" type="text" name="username" autofocus required id="id_username">
          </div>
          <div class="mb-4">
            <label class="form-label" for="id_password">Password</label>
            <input class="form-control form-control-lg" type="password" name="password" required id="id_password">
          </div>
          <button class="btn btn-primary btn-lg w-100" type="submit">Login</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
