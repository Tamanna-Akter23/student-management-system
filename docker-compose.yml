services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: student_db
      MYSQL_USER: student_user
      MYSQL_PASSWORD: student_pass
      MYSQL_ROOT_PASSWORD: root_pass
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: course_db
      POSTGRES_USER: course_user
      POSTGRES_PASSWORD: course_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course_user -d course_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      MYSQL_HOST: mysql
      POSTGRES_HOST: postgres
      MONGO_URI: mongodb://mongo:27017/
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started

volumes:
  mysql_data:
  postgres_data:
  mongo_data:
